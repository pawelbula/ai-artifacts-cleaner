[project]
name = "ai-artifacts-cleaner"
version = "0.1.0"
description = "Removes metadata and AI traces (EXIF, XMP, ICC, C2PA/JUMBF) from images"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0",
]

[project.scripts]
aac = "aac.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aac*"]
